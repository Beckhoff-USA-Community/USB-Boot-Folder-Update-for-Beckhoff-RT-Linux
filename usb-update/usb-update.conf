# usb-update configuration — installed at /etc/usb-update/usb-update.conf and
# sourced by all scripts in /usr/lib/usb-update.
# Tunables only: anything identical on every supported device (boot folder,
# HMI server paths, ADS constants, UI session) is hardcoded in the scripts.

# --- USB stick detection ----------------------------------------------------
# Volume label that marks an update stick (case-insensitive).
# SECURITY: there is none beyond physical access — anyone with a labeled stick
# and the power switch can replace the application. If that is not acceptable,
# add signing to the manifest check in detect.sh.
USB_LABEL=UPDATE
MOUNT_POINT=/run/usb-update/mnt
# Seconds to poll for the stick, which can enumerate late after a hard power
# cycle. Trade-off: a boot with NO stick waits the full time before TwinCAT
# starts. 0 = single check.
USB_WAIT_SECS=10

# --- Stick layout & acceptance ----------------------------------------------
# Folders at the stick root; either may be absent, at least one must exist.
# PKG_TC_SUBDIR holds the TwinCAT boot folder contents; PKG_HMI_SUBDIR holds
# one folder per published TF2000 HMI instance (captured from
# /var/lib/tchmisrv/service/ with TcHmiSrv stopped).
PKG_TC_SUBDIR="TwinCAT/Boot"
PKG_HMI_SUBDIR="TwinCAT HMI"
# If the stick's manifest.txt has "target=<TYPE>", the update is refused
# unless <TYPE> is a case-insensitive prefix of this device's type.
# Empty = auto-detect the type from hardware (e.g. "CX9240-0215"); set only
# to match sticks against a logical fleet name instead.
TARGET_TYPE=

# --- Device state preserved across updates ----------------------------------
# Matches (relative to Boot; globs allowed) are dropped from the package and
# carried over from the device: the event log and PLC persistent data
# (Plc/*.bootdata* — see
# https://infosys.beckhoff.com/content/1033/tc3_grundlagen/4291095051.html).
# BEFORE PRODUCTION: activate your real application, look inside
# /etc/TwinCAT/3.1/Boot, and make sure everything stateful (persistent
# variables, event logs, etc.) is covered here. Getting this wrong clobbers
# machine state on the first update.
PRESERVE_GLOBS="LoggedEvents.db Plc/*.bootdata*"
# Same, inside each HMI instance (top level only): the HMI event history.
# NOTE: storage.db is NOT preserved — it is replaced wholesale by the stick's
# copy. It carries server-side user data (HMI accounts, recipe edits made on
# the device); if your application stores data through the HMI, work out a
# preserve strategy first.
HMI_PRESERVE_GLOBS="logger.db*"

# --- Operator dialog --------------------------------------------------------
# Seconds before an unanswered dialog defaults to Skip.
PROMPT_TIMEOUT=60
# swaynag renders the message on ONE line and runs it under the buttons when
# too long — reduce the font size if they collide on your display.
PROMPT_FONT_SIZE=14
# Touch-friendly rendering (bash array: values with spaces stay intact).
SWAYNAG_ARGS=(-y overlay -e top -f "pango:DejaVu Sans $PROMPT_FONT_SIZE" --message-padding 12 --button-padding 8)
# The HMI browser (TF1200 UI Client) is held back at boot until the operator
# has answered the dialog — the package routes its sway exec line through
# ui-gate.sh. This is the ceiling in seconds after which the client starts
# regardless (safety net if the update service never releases it).
# Empty = auto: USB_WAIT_SECS + PROMPT_TIMEOUT + 60s slack.
UI_GATE_TIMEOUT=

# --- Update behavior --------------------------------------------------------
# 1 = restart the IPC right after applying, so a clean boot loads the new
# Boot folder (validation runs after the restart; a stick left in the port is
# recognized as already applied). 0 = continue the current boot and start
# TwinCAT with the new Boot folder right away.
REBOOT_AFTER_UPDATE=0

# --- Post-update validation -------------------------------------------------
# Backstop cap (seconds) on waiting for TwinCAT RUN; a failed start is
# normally detected within seconds from the TcSystemServiceUm journal.
VALIDATE_TIMEOUT=120
# On a failed start, copy the last N error-priority TcSystemServiceUm journal
# entries into our own log (`journalctl -t usb-update` then shows the cause).
TC_ERR_REPORT_LINES=10
# HMI health probe; only checked on devices with enabled HMI instances.
HMI_URL=http://127.0.0.1:2010/
HMI_VALIDATE_TIMEOUT=60
# 1 = on failed validation, offer an on-screen revert to the previous working
# state (the machine restarts, and the reverted boot is validated too).
# 0 = just show a "contact service" notice and leave the failed state.
PROMPT_REVERT_ON_FAILURE=1

# --- Local state ------------------------------------------------------------
STATE_DIR=/var/lib/usb-update
BACKUP_DIR=/var/lib/usb-update/backup
BACKUP_RETAIN=1
LOG_TAG=usb-update
